<c:ignore xmlns:c="contractpal">
  <div class="pb-section">

    <!-- Page header: one title, one primary action (design-build: one primary per view). -->
    <div class="pb-page-head">
      <div>
        <h1 class="pb-title">Dashboard</h1>
        <p class="pb-subtitle">Overview</p>
      </div>
      <c:a action="getDashboard" class="pb-btn pb-btn-primary">Refresh</c:a>
    </div>

    <!-- Stat cards: number-forward, tabular figures (design-build recipe). The workflow sets
         ${statCount} etc. on the payload; replace with your real metrics. -->
    <div class="pb-grid-3">
      <div class="pb-stat">
        <p class="pb-stat-label">Records</p>
        <p class="pb-stat-value">${statCount}</p>
      </div>
      <div class="pb-stat">
        <p class="pb-stat-label">This week</p>
        <p class="pb-stat-value">${statWeek}</p>
      </div>
      <div class="pb-stat">
        <p class="pb-stat-label">Status</p>
        <p class="pb-stat-value">${statStatus}</p>
      </div>
    </div>

    <!-- Data table with the c:list pattern + a designed empty state (one line + one action). -->
    <div class="pb-card">
      <h2 class="pb-card-title">Recent items</h2>
      <c:if test="${hasItems eq 'true'}">
        <div class="pb-table-wrap">
          <table class="pb-table">
            <thead>
              <tr><th>Name</th><th class="pb-num">Value</th><th>Updated</th></tr>
            </thead>
            <tbody>
              <c:list name="items" id="item">
                <tr>
                  <td data-label="Name">${item.name}</td>
                  <td data-label="Value" class="pb-num">${item.value}</td>
                  <td data-label="Updated" class="pb-muted">${item.updated}</td>
                </tr>
              </c:list>
            </tbody>
          </table>
        </div>
      </c:if>
      <c:if test="${hasItems eq 'false'}">
        <div class="pb-state">
          <p class="pb-state-title">No items yet.</p>
          <c:a action="getDashboard" class="pb-btn pb-btn-secondary">Refresh</c:a>
        </div>
      </c:if>
    </div>

  </div>
</c:ignore>

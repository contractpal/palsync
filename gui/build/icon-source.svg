<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d92d6"/>
      <stop offset="45%" stop-color="#4c72b3"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(512,512) scale(1.3) translate(-512,-512)">
  <!-- pins: three per side -->
  <g fill="#2a2c30">
    <rect x="330" y="150" width="60" height="110"/>
    <rect x="482" y="150" width="60" height="110"/>
    <rect x="634" y="150" width="60" height="110"/>

    <rect x="330" y="764" width="60" height="110"/>
    <rect x="482" y="764" width="60" height="110"/>
    <rect x="634" y="764" width="60" height="110"/>

    <rect x="150" y="330" width="110" height="60"/>
    <rect x="150" y="482" width="110" height="60"/>
    <rect x="150" y="634" width="110" height="60"/>

    <rect x="764" y="330" width="110" height="60"/>
    <rect x="764" y="482" width="110" height="60"/>
    <rect x="764" y="634" width="110" height="60"/>
  </g>

  <!-- chip body with pin-1 notch bitten out of the top-left corner -->
  <path d="M 316 260
           L 460 260
           L 460 316 A 56 56 0 0 0 516 372
           L 708 372
           A 60 60 0 0 1 768 432
           L 768 708
           A 60 60 0 0 1 708 768
           L 316 768
           A 60 60 0 0 1 256 708
           L 256 320
           A 60 60 0 0 1 316 260 Z"
        fill="url(#body)"/>

  <path d="M 316 260
           L 460 260
           L 460 316 A 56 56 0 0 0 516 372
           L 708 372
           A 60 60 0 0 1 768 432
           L 768 708
           A 60 60 0 0 1 708 768
           L 316 768
           A 60 60 0 0 1 256 708
           L 256 320
           A 60 60 0 0 1 316 260 Z"
        fill="url(#gloss)"/>
  </g>
</svg>

name: Bump version

# Bumps gui/package.json's version once per release. Run it by hand (Actions -> Bump version ->
# Run workflow) before dispatching the build-{win,mac,linux} workflows. It used to run on every
# push to main, which put a bot commit on main after each push (44 of them in 60 days) and moved
# main under concurrent work.
#   - auto (default): minor (X.Y.Z -> X.(Y+1).0) if anything under gui/ changed since the last
#     version bump - that's the Electron app itself, so a change there gets its own visible bump;
#     patch (X.Y.Z -> X.Y.(Z+1)) otherwise - covers everything else that still ships inside Chip
#     (e.g. node_modules/palsync/** bundling the repo root).
#   - patch / minor: force that level.
# Major bumps are still a human semver call - Claude flags those in conversation when a change
# looks breaking, but doesn't perform them here.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level"
        type: choice
        options: [auto, patch, minor]
        default: auto

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN, but persisted so the push step below can use it.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide bump level
        id: level
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          if [ "$LEVEL" != "auto" ]; then
            echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff against this workflow's own last bump commit. With none found, default to the
          # safer minor bump rather than risk silently under-bumping.
          BASE=$(git log -1 --format=%H --grep='^chore(gui): bump version to ')
          if [ -z "$BASE" ]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD -- gui/ ':!gui/package.json' ':!gui/package-lock.json' | grep -q .; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        working-directory: gui
        # --no-git-tag-version: we commit by hand below instead of letting npm tag/commit.
        # npm's own `version` command updates package-lock.json's version fields too, which
        # also fixes the lockfile drifting out of sync with package.json.
        run: npm version ${{ steps.level.outputs.level }} --no-git-tag-version

      - name: Commit and push
        run: |
          NEW_VERSION=$(node -p "require('./gui/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gui/package.json gui/package-lock.json
          git commit -m "chore(gui): bump version to $NEW_VERSION [skip ci]"
          git push

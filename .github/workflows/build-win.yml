name: Build Windows (Chip Pal Builder)

on:
  workflow_dispatch:

jobs:
  build:
    # Unsigned for now - same as the current local flow (the code-signing cert lives on a thumb
    # drive that deliberately never touches any build machine). Download the artifact this
    # produces and sign it by hand, same as today, until Azure Trusted Signing is wired up.
    #
    # Pinned to windows-2022, not windows-latest: confirmed live (2026-09-15) that windows-latest
    # now points at a brand-new image (win25-vs2026) shipping a Visual Studio version this
    # project's @electron/node-gyp (via electron-rebuild, needed for node-pty's native build)
    # doesn't recognize yet - "invalid versionYear: undefined" / "could not find a version of
    # Visual Studio 2017 or newer". windows-2022 matches the VS2022 Build Tools this project's
    # local Windows build already uses (see BUILD.md).
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install
        env:
          # The GUI never needs Chromium eagerly (lazy, on first browser-audit use, by design) -
          # skip it here since it's unrelated to packaging and would just slow the build down.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install gui dependencies
        working-directory: gui
        run: npm install

      - name: Build (unsigned)
        working-directory: gui
        run: npm run build:win:ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChipPalBuilder-win-unsigned
          path: gui/dist/ChipPalBuilder.exe

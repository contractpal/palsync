name: Build Mac (Chip Pal Builder)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the zip + mac-versions.txt to S3 after a successful build"
        type: boolean
        default: false

jobs:
  build:
    # arm64 only for now (matches the already-validated local M1 build) - macos-latest runners
    # are Apple Silicon, so this needs no cross-compilation. x64 would need node-pty's native
    # module cross-built for x64, deliberately out of scope for this first CI pass.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install
        env:
          # The GUI never needs Chromium eagerly (lazy, on first browser-audit use, by design) -
          # skip it here since it's unrelated to packaging and would just slow the build down.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install gui dependencies
        working-directory: gui
        run: npm install

      # electron-builder's own CSC_LINK/CSC_KEY_PASSWORD handling creates its own temporary
      # keychain but then passes the CERT's password (not the keychain's own randomly-generated
      # one) to `security set-key-partition-list -k`, which needs the KEYCHAIN's password -
      # confirmed live (2026-09-15): fails with "SecKeychainUnlock: ... not correct" unless the
      # two happen to match (see app-builder-lib/out/codeSign/macCodeSign.js's createKeychain/
      # importCerts). Importing the cert ourselves via this well-tested action sidesteps
      # electron-builder's buggy path entirely - it does its own, correct partition-list setup,
      # and leaves the identity in the default keychain for electron-builder to auto-detect, the
      # same way the local Mac build already works (see BUILD.md).
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build, sign, and notarize (arm64 zip only)
        working-directory: gui
        run: npm run build:mac:ci
        env:
          # electron-builder auto-notarizes when these three are set - no extra afterSign hook
          # needed (confirmed already true for the local Mac build, per BUILD.md).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Checks the actual signed/notarized/zipped artifact about to ship - afterPack.js's own
      # check (see its comments) only proves app.asar was intact BEFORE signing/notarization/
      # zipping touched it. Confirmed live 2026-09-15: a corrupted app.asar shipped all the way to
      # a downloaded, installed build before anyone noticed - this fails the job loudly instead.
      - name: Verify built artifact integrity
        working-directory: gui
        run: node scripts/verifyMacZip.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChipPalBuilder-mac-arm64
          path: |
            gui/dist/*.zip
            gui/dist/mac-versions.txt

      - name: Configure AWS credentials
        if: ${{ inputs.publish }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish to S3
        if: ${{ inputs.publish }}
        working-directory: gui/dist
        run: |
          for f in *.zip; do
            aws s3 cp "$f" "s3://contractpal-cloudpiston-downloads/$f"
          done
          aws s3 cp mac-versions.txt s3://contractpal-cloudpiston-downloads/mac-versions.txt

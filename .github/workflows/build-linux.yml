name: Build Linux (Chip Pal Builder)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the AppImage + linux-versions.txt to S3 after a successful build"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install
        env:
          # The GUI never needs Chromium eagerly (lazy, on first browser-audit use, by design) -
          # skip it here since it's unrelated to packaging and would just slow the build down.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install gui dependencies
        working-directory: gui
        run: npm install

      - name: Build Linux AppImage
        working-directory: gui
        run: npm run build:linux:ci

      # electron-builder's stock AppImage FATAL-aborts on launch on modern Ubuntu (confirmed live
      # 2026-09-15 - chrome-sandbox can never be root-owned+setuid for a self-extracting AppImage,
      # and no fix from inside the app's own JS can work since the crash happens in Electron's
      # native bootstrap before any of the app's code runs). appimagetool repacks the AppImage
      # with the fix (see patchLinuxAppRun.js) baked into its AppRun launcher script. Installed by
      # extracting it once via --appimage-extract (no FUSE needed either way, unlike a normal
      # AppImage launch) so this doesn't depend on FUSE being available on the runner.
      - name: Install appimagetool
        run: |
          sudo apt-get update -y
          sudo apt-get install -y squashfs-tools
          curl -L -o /tmp/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Fix AppImage Chromium sandbox (bake in ELECTRON_DISABLE_SANDBOX)
        working-directory: gui
        run: node scripts/patchLinuxAppRun.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChipPalBuilder-linux
          path: |
            gui/dist/ChipPalBuilder.AppImage
            gui/dist/linux-versions.txt

      - name: Configure AWS credentials
        if: ${{ inputs.publish }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish to S3
        if: ${{ inputs.publish }}
        working-directory: gui/dist
        run: |
          aws s3 cp ChipPalBuilder.AppImage s3://contractpal-cloudpiston-downloads/ChipPalBuilder.AppImage
          aws s3 cp linux-versions.txt s3://contractpal-cloudpiston-downloads/linux-versions.txt
